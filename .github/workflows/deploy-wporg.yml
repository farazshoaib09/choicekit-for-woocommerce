name: Deploy to WordPress.org

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing semantic version tag to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref_name }}
          fetch-depth: 0
      - name: Verify release tag and metadata
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"
          grep -Eq "^[[:space:]]*\* Version: $RELEASE_VERSION$" choicekit-for-woocommerce.php
          grep -Fxq "Stable tag: $RELEASE_VERSION" readme.txt
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/admin.js
          node --check assets/js/frontend.js
      - name: Build WordPress.org distribution
        shell: bash
        run: |
          mkdir -p dist
          cp choicekit-for-woocommerce.php readme.txt dist/
          cp -R includes assets dist/
          test -f dist/choicekit-for-woocommerce.php
          test -f dist/readme.txt
          test ! -e dist/tests
      - name: Deploy tag to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: choicekit-for-woocommerce
          BUILD_DIR: dist
          VERSION: ${{ env.RELEASE_VERSION }}
