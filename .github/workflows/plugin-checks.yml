name: Plugin checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/admin.js
          node --check assets/js/frontend.js
      - name: Check release metadata
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*\* Version: //p' choicekit-for-woocommerce.php | head -n1)
          stable=$(sed -n 's/^Stable tag: //p' readme.txt | head -n1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$stable"
